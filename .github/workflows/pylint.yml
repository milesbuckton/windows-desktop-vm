name: Pylint

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Analysing changed code with pylint
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "Manual dispatch: linting every tracked Python file"
          python scripts/lint-python.py
          exit 0
        fi
        if [ "$EVENT_NAME" = "pull_request" ]; then
          echo "Pull request: linting Python files changed since $BASE_SHA"
          python scripts/lint-python.py --changed-since "$BASE_SHA"
          exit 0
        fi
        echo "Push: linting Python files changed since $BEFORE_SHA"
        python scripts/lint-python.py --changed-since "$BEFORE_SHA"
    - name: Unit tests
      run: python scripts/run-tests.py
